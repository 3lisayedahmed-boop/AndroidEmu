name: Build AndroidEmu IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create App Structure and Source Code
        run: |
          mkdir -p Payload/AndroidEmu.app

          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #include <sys/mman.h>

          typedef struct {
              int32_t registers[16];
              uint32_t pc;
              uint8_t *jit_memory;
          } DalvikVM;

          NSString* run_android_vm() {
              NSMutableString *output = [NSMutableString stringWithString:@"iOS 16 Android Engine Active\n\n"];
              DalvikVM *vm = (DalvikVM*)malloc(sizeof(DalvikVM));
              memset(vm->registers, 0, sizeof(vm->registers));
              vm->pc = 0;
              vm->jit_memory = mmap(NULL, 1024 * 1024, PROT_READ | PROT_WRITE | PROT_EXEC, MAP_ANON | MAP_PRIVATE | MAP_JIT, -1, 0);
              
              if (vm->jit_memory == MAP_FAILED) {
                  free(vm);
                  return @"Error: JIT Memory blocked.\nPlease install this IPA using TrollStore.";
              }
              
              [output appendFormat:@"[SUCCESS] JIT Memory allocated: %p\n\n", vm->jit_memory];
              
              uint8_t dex_code[] = { 0x12, 0x50, 0x12, 0x31, 0x90, 0x02, 0x00, 0x01, 0x0E };
              size_t length = sizeof(dex_code);
              
              while (vm->pc < length) {
                  uint8_t opcode = dex_code[vm->pc];
                  switch (opcode) {
                      case 0x12: {
                          uint8_t reg = dex_code[vm->pc + 1] & 0x0F;
                          int8_t val = (dex_code[vm->pc + 1] & 0xF0) >> 4;
                          vm->registers[reg] = val;
                          [output appendFormat:@"[DEX] Loaded %d into Android register v%d\n", val, reg];
                          vm->pc += 2;
                          break;
                      }
                      case 0x90: {
                          uint8_t dst = dex_code[vm->pc + 1];
                          uint8_t src1 = dex_code[vm->pc + 2];
                          uint8_t src2 = dex_code[vm->pc + 3];
                          vm->registers[dst] = vm->registers[src1] + vm->registers[src2];
                          [output appendFormat:@"[DEX] Added v%d + v%d -> Result in v%d = %d\n", src1, src2, dst, vm->registers[dst]];
                          vm->pc += 4;
                          break;
                      }
                      case 0x0E:
                          [output appendString:@"\n[DEX] Android bytecode execution finished."];
                          vm->pc = length;
                          break;
                      default:
                          vm->pc = length;
                          break;
                  }
              }
              munmap(vm->jit_memory, 1024 * 1024);
              free(vm);
              return output;
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view.backgroundColor = [UIColor blackColor];
              UITextView *console = [[UITextView alloc] initWithFrame:CGRectMake(20, 60, self.window.frame.size.width - 40, self.window.frame.size.height - 100)];
              console.backgroundColor = [UIColor blackColor];
              console.textColor = [UIColor greenColor];
              console.font = [UIFont fontWithName:@"Courier" size:15];
              console.editable = NO;
              console.text = run_android_vm();
              [vc.view addSubview:console];
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string AndroidEmu" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.custom.androidemu" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string AndroidEmu" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" Payload/AndroidEmu.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" Payload/AndroidEmu.app/Info.plist

          /usr/libexec/PlistBuddy -c "Add :application-identifier string com.custom.androidemu" entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.private.security.no-container bool true" entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-jit bool true" entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :dynamic-codesigning bool true" entitlements.plist

      - name: Compile and Sign IPA
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 main.m -o Payload/AndroidEmu.app/AndroidEmu -framework UIKit -framework Foundation -fobjc-arc
          brew install ldid
          ldid -Sentitlements.plist Payload/AndroidEmu.app/AndroidEmu
          chmod +x Payload/AndroidEmu.app/AndroidEmu
          zip -r AndroidEmu.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AndroidEmu-IPA
          path: AndroidEmu.ipa
