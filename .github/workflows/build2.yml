name: Build AndroidEmu IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create App Structure and Source Code
        run: |
          mkdir -p Payload/AndroidEmu.app

          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #include <sys/mman.h>

          typedef struct {
              int32_t registers[16];
              uint32_t pc;
              uint8_t *jit_memory;
              BOOL using_jit;
          } DalvikVM;

          NSString* run_android_vm() {
              NSMutableString *output = [NSMutableString stringWithString:@"=== iOS 16 Android Engine Active ===\n\n"];
              DalvikVM *vm = (DalvikVM*)malloc(sizeof(DalvikVM));
              memset(vm->registers, 0, sizeof(vm->registers));
              vm->pc = 0;

              // Try allocating RWX memory without MAP_JIT first (safe for TrollStore dynamic-codesigning)
              vm->jit_memory = mmap(NULL, 1024 * 1024, PROT_READ | PROT_WRITE | PROT_EXEC, MAP_ANON | MAP_PRIVATE, -1, 0);
              if (vm->jit_memory != MAP_FAILED) {
                  vm->using_jit = YES;
                  [output appendFormat:@"[SUCCESS] RWX JIT Memory allocated: %p\n\n", vm->jit_memory];
              } else {
                  // Safe fallback to RW memory so the app never crashes
                  vm->jit_memory = mmap(NULL, 1024 * 1024, PROT_READ | PROT_WRITE, MAP_ANON | MAP_PRIVATE, -1, 0);
                  vm->using_jit = NO;
                  [output appendFormat:@"[INFO] Running in Interpreter Mode (Memory: %p)\n\n", vm->jit_memory];
              }

              uint8_t dex_code[] = { 0x12, 0x50, 0x12, 0x31, 0x90, 0x02, 0x00, 0x01, 0x0E };
              size_t length = sizeof(dex_code);

              while (vm->pc < length) {
                  uint8_t opcode = dex_code[vm->pc];
                  switch (opcode) {
                      case 0x12: {
                          uint8_t reg = dex_code[vm->pc + 1] & 0x0F;
                          int8_t val = (dex_code[vm->pc + 1] & 0xF0) >> 4;
                          vm->registers[reg] = val;
                          [output appendFormat:@"[DEX] const/4 -> Loaded %d into register v%d\n", val, reg];
                          vm->pc += 2;
                          break;
